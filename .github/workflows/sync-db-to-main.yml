name: Sync DB to Main

on:
  push:
    branches: [data]
    paths:
      - "data/*.db"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch data branch DB
        run: |
          git fetch origin data
          git checkout origin/data -- data/insights.db

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Convert WAL → DELETE mode
        run: node scripts/prepare-db.js

      - name: Commit to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/insights.db
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "data: sync insights.db from data branch"
          git push origin main
